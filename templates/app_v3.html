<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ostatnie mecze — API-Football</title>
  <style>
    :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e5e5e5; --card:#fafafa; --hover:#f2f2f2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161a; --fg:#e8e8e8; --muted:#999; --line:#2a2e35; --card:#1b1e24; --hover:#20242b; }
    }
    * { box-sizing:border-box; }
    body { margin:0; padding:2rem 1rem; background:var(--bg); color:var(--fg);
           font:16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width:1000px; margin:0 auto; }
    h1 { font-size:1.6rem; margin:0 0 .25rem; }
    .quota { font-size:.8rem; color:var(--muted); margin:0 0 1.25rem; }
    .filters { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; margin-bottom:.75rem; }
    select { font:inherit; padding:.5rem .7rem; background:var(--card); color:var(--fg);
             border:1px solid var(--line); border-radius:6px; }
    select:disabled { opacity:.5; }
    .grow { min-width:190px; flex:1 1 190px; }
    label { display:flex; align-items:center; gap:.4rem; font-size:.85rem; color:var(--muted); }
    #status { min-height:1.5rem; font-size:.85rem; color:var(--muted); margin-bottom:1rem; }
    #status.error { color:#b62324; }
    .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
    table { width:100%; border-collapse:collapse; font-size:.92rem; }
    th, td { padding:.7rem .9rem; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { background:var(--card); font-weight:600; font-size:.78rem;
         text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    tr:last-child td { border-bottom:none; }
    tr.match { cursor:pointer; }
    tr.match:hover { background:var(--hover); }
    .score { font-variant-numeric:tabular-nums; font-weight:600; }
    .team { display:flex; align-items:center; gap:.5rem; }
    .team img { width:20px; height:20px; object-fit:contain; flex-shrink:0; }
    .badge { display:inline-block; width:1.5rem; text-align:center; border-radius:4px;
             font-weight:700; font-size:.78rem; padding:.15rem 0; color:#fff; }
    .W { background:#1a7f37; } .D { background:#8a6d00; } .L { background:#b62324; }
    .muted { color:var(--muted); font-size:.85rem; }
    tr.details td { background:var(--card); white-space:normal; }
    .events { list-style:none; margin:0; padding:0; display:grid; gap:.3rem; }
    .events li { display:flex; gap:.6rem; align-items:baseline; font-size:.88rem; }
    .ev-min { min-width:3.2rem; color:var(--muted); font-variant-numeric:tabular-nums; }
    .ev-ico { min-width:1.6rem; }
    .ev-note { color:var(--muted); font-size:.82rem; }
    .shortcuts { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
    .shortcuts button { font:inherit; font-size:.85rem; padding:.35rem .7rem;
      background:var(--card); color:var(--fg); border:1px solid var(--line);
      border-radius:999px; cursor:pointer; }
    .shortcuts button:hover { background:var(--hover); }
    .shortcuts button.clear { margin-left:auto; color:var(--muted); }
    .st-title { font-size:1.1rem; margin:2rem 0 .6rem; }
    .st-group { font-size:.85rem; color:var(--muted); margin:.9rem 0 .4rem; }
    .st td, .st th { padding:.5rem .7rem; }
    .st .num { text-align:right; font-variant-numeric:tabular-nums; }
    .st tr.hl { background:var(--hover); font-weight:600; }
    .form { display:inline-flex; gap:.15rem; }
    .form i { width:.85rem; height:.85rem; border-radius:2px; font-style:normal;
              font-size:.6rem; line-height:.85rem; text-align:center; color:#fff; }
                  .st td.rank { border-left:4px solid transparent; }
    .st tr.z-ucl  td.rank { border-left-color:#1a5fb4; }
    .st tr.z-uel  td.rank { border-left-color:#e07000; }
    .st tr.z-uecl td.rank { border-left-color:#1a7f37; }
    .st tr.z-pro  td.rank { border-left-color:#6a3fb5; }
    .st tr.z-rel  td.rank { border-left-color:#b62324; }
 
    .legend { display:flex; flex-wrap:wrap; gap:1rem; margin:.7rem 0 0;
              font-size:.8rem; color:var(--muted); }
    .legend span { display:flex; align-items:center; gap:.4rem; }
    .legend i { width:.9rem; height:.9rem; border-radius:2px; display:inline-block; }
  </style>
</head>
<body>
<main>
  <h1>Ostatnie mecze</h1>
  <p class="quota" id="quota"></p>

  <div class="shortcuts" id="shortcuts"></div>
 
  <div class="filters">
    <select id="country" class="grow" aria-label="Kraj"></select>
    <select id="league"  class="grow" aria-label="Rozgrywki" disabled></select>
    <select id="season"  aria-label="Sezon" disabled></select>
    <select id="team"    class="grow" aria-label="Druzyna" disabled></select>
    <label>Liczba meczow
      <select id="limit">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </label>
  </div>
 
  <div id="status"></div>
 
  <div class="wrap">
    <table>
      <thead>
        <tr><th>Data</th><th>Gospodarz</th><th>Wynik</th><th>Gosc</th>
            <th>Rozgrywki</th><th>Kolejka</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="muted">Kliknij mecz, zeby zobaczyc gole i kartki.</p>
  <div id="standings"></div>
</main>
 
<script>
const $ = id => document.getElementById(id);
const countrySel = $("country"), leagueSel = $("league"),
      seasonSel  = $("season"),  teamSel   = $("team"),
      limitSel   = $("limit");
const tbody = $("rows"), statusBox = $("status"), quotaBox = $("quota");
 
const STORAGE_KEY = "mecze-v3";
const MAX_SEASON = 2024;
let leagues = [];
 
// Sprawdz id w /api/leagues?country=... zanim dodasz wlasne skroty.
const PRESETS = [
  { label: "Premier League", country: "England", league: 39 },
  { label: "La Liga",        country: "Spain",   league: 140 },
  { label: "Bundesliga",     country: "Germany", league: 78 },
  { label: "Serie A",        country: "Italy",   league: 135 },
  { label: "Ligue 1",        country: "France",  league: 61 },
  { label: "Ekstraklasa",    country: "Poland",  league: 106 },
  { label: "Liga Mistrzow",  country: "World",   league: 2 },
];

const ZONE_LABELS = {
  ucl:  ["Liga Mistrzow",     "#1a5fb4"],
  uel:  ["Liga Europy",       "#e07000"],
  uecl: ["Liga Konferencji",  "#1a7f37"],
  pro:  ["Awans",             "#6a3fb5"],
  rel:  ["Spadek",            "#b62324"],
};


function setStatus(msg, isError = false) {
  statusBox.textContent = msg;
  statusBox.classList.toggle("error", isError);
}
 
async function api(path) {
  const r = await fetch(path);
  const data = await r.json().catch(() => null);
  if (!r.ok) {
    const d = data?.detail;
    const msg = Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || `HTTP ${r.status}`);
    throw new Error(msg);
  }
  return data;
}
 
async function refreshQuota() {
  try {
    const q = await api("/api/quota");
    quotaBox.textContent = q.remaining
      ? `Pozostale zapytania dzisiaj: ${q.remaining} / ${q.limit}`
      : "";
  } catch { /* nieistotne */ }
}
 
function fill(sel, items, placeholder) {
  sel.replaceChildren();
  if (placeholder !== null) {
    const first = document.createElement("option");
    first.value = "";
    first.textContent = placeholder;
    sel.append(first);
  }
  for (const it of items) {
    const o = document.createElement("option");
    o.value = it.value;
    o.textContent = it.label;
    sel.append(o);
  }
  sel.disabled = items.length === 0;
}
 
function reset(sel, placeholder) {
  fill(sel, [], placeholder);
  sel.disabled = true;
}
 
// ---------------- zapamietywanie wyboru ----------------
 
function saveState() {
  const state = {
    country: countrySel.value,
    league: leagueSel.value,
    season: seasonSel.value,
    team: teamSel.value,
    limit: limitSel.value,
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* prywatny tryb */ }
}
 
function readState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
  catch { return null; }
}
 
async function restoreState() {
  const s = readState();
  if (!s || !s.country) return;
 
  countrySel.value = s.country;
  if (!countrySel.value) return;          // kraju nie ma na liscie
  await loadLeagues();
 
  if (!s.league) return;
  leagueSel.value = s.league;
  if (!leagueSel.value) return;
  await loadSeasons();                     // ustawi domyslny sezon i wczyta druzyny
 
  if (s.season) {
    seasonSel.value = s.season;
    if (seasonSel.value) await loadTeams();
  }
  if (s.limit) limitSel.value = s.limit;
 
  if (s.team) {
    teamSel.value = s.team;
    if (teamSel.value) await loadMatches();
  }
}
 
// ---------------- skroty ----------------
 
function buildShortcuts() {
  const box = $("shortcuts");
  box.replaceChildren();
  for (const p of PRESETS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "★ " + p.label;
    b.addEventListener("click", () => applyPreset(p));
    box.append(b);
  }
 
  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "clear";
  clear.textContent = "Wyczysc";
  clear.addEventListener("click", resetAll);
  box.append(clear);
}
 
async function applyPreset(p) {
  countrySel.value = p.country;
  if (!countrySel.value) return setStatus(`Brak kraju "${p.country}" na liscie.`, true);
 
  await loadLeagues();
 
  leagueSel.value = String(p.league);
  if (!leagueSel.value) return setStatus(`Brak rozgrywek o id ${p.league} w tym kraju.`, true);
 
  await loadSeasons();
  saveState();
}

function resetAll() {
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* prywatny tryb */ }
 
  leagues = [];
  countrySel.value = "";
  reset(leagueSel, "— rozgrywki —");
  reset(seasonSel, "— sezon —");
  reset(teamSel, "— druzyna —");
  limitSel.value = "10";
  tbody.replaceChildren();
  clearStandings();
  setStatus("");
}


// ---------------- kaskada ----------------
 
async function loadLeagues() {
  reset(leagueSel, "— rozgrywki —");
  reset(seasonSel, "— sezon —");
  reset(teamSel, "— druzyna —");
  tbody.replaceChildren();
  clearStandings();
  saveState();
  if (!countrySel.value) return setStatus("");
 
  setStatus("Wczytuje rozgrywki…");
  try {
    leagues = await api(`/api/leagues?country=${encodeURIComponent(countrySel.value)}`);
 
    leagueSel.replaceChildren();
    const first = document.createElement("option");
    first.value = "";
    first.textContent = "— rozgrywki —";
    leagueSel.append(first);
 
    for (const [label, type] of [["Ligi", "League"], ["Puchary", "Cup"]]) {
      const group = leagues.filter(l => l.type === type);
      if (!group.length) continue;
 
      const og = document.createElement("optgroup");
      og.label = label;
      for (const l of group) {
        const o = document.createElement("option");
        o.value = l.id;
        o.textContent = (l.top ? "★ " : "") + l.name;
        og.append(o);
      }
      leagueSel.append(og);
    }
 
    for (const l of leagues.filter(l => l.type !== "League" && l.type !== "Cup")) {
      const o = document.createElement("option");
      o.value = l.id;
      o.textContent = l.name;
      leagueSel.append(o);
    }
 
    leagueSel.disabled = leagues.length === 0;
    setStatus(leagues.length ? "" : "Brak rozgrywek dla tego kraju.");
    refreshQuota();
  } catch (e) { setStatus(e.message, true); }
}
 
async function loadSeasons() {
  reset(seasonSel, "— sezon —");
  reset(teamSel, "— druzyna —");
  tbody.replaceChildren();
  clearStandings();
  setStatus("");
  saveState();
  if (!leagueSel.value) return;
 
  const lg = leagues.find(l => String(l.id) === leagueSel.value);
  if (!lg) return;
 
  fill(seasonSel, lg.seasons.map(y => ({ value: y, label: y })), null);
  fill(seasonSel, lg.seasons.map(y => ({ value: y, label: y})), null);
  seasonSel.value = lg.seasons.find(y => y <= MAX_SEASON) ?? lg.seasons[0];
  await loadTeams();
}
 
async function loadTeams() {
  reset(teamSel, "— druzyna —");
  tbody.replaceChildren();
  clearStandings();
  saveState();
  if (!leagueSel.value || !seasonSel.value) return setStatus("");
 
  setStatus("Wczytuje druzyny…");
  try {
    const teams = await api(`/api/teams?league=${leagueSel.value}&season=${seasonSel.value}`);
    fill(teamSel, teams.map(t => ({ value: t.id, label: t.name })), "— druzyna —");
    setStatus(teams.length ? "" : "Brak druzyn dla tego sezonu — sprobuj innego.");
    refreshQuota();
  } catch (e) { setStatus(e.message, true); }
}

function formCell(form) {
  const td = document.createElement("td");
  const box = document.createElement("span");
  box.className = "form";
  for (const ch of (form || "").slice(-5)) {
    const i = document.createElement("i");
    i.className = ch;              // W / D / L — te same kolory co plakietki
    i.textContent = ch;
    box.append(i);
  }
  td.append(box);
  return td;
}

function clearStandings() {
  $("standings").replaceChildren();
}

async function loadStandings() {
  const box = $("standings");
  box.replaceChildren();
  if (!leagueSel.value || !seasonSel.value) return;
 
  let groups;
  try {
    groups = await api(`/api/standings?league=${leagueSel.value}&season=${seasonSel.value}`);
  } catch {
    return;                        // brak tabeli nie moze psuc listy meczow
  }
  refreshQuota();
  if (!groups.length) return;      // puchary bez fazy grupowej
 
  const title = document.createElement("h2");
  title.className = "st-title";
  title.textContent = "Tabela";
  box.append(title);
 
  for (const g of groups) {
    if (g.name) {
      const h = document.createElement("p");
      h.className = "st-group";
      h.textContent = g.name;
      box.append(h);
    }
 
    const wrap = document.createElement("div");
    wrap.className = "wrap";
    const table = document.createElement("table");
    table.className = "st";
 
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    for (const [label, cls] of [["#", "num"], ["Druzyna", ""], ["M", "num"],
                                ["W", "num"], ["R", "num"], ["P", "num"],
                                ["Bramki", "num"], ["+/-", "num"], ["Pkt", "num"], ["Forma", ""]]) {
      const th = document.createElement("th");
      th.textContent = label;
      if (cls) th.className = cls;
      hr.append(th);
    }
    thead.append(hr);
    table.append(thead);
 
    const tb = document.createElement("tbody");
    for (const r of g.rows) {
      const tr = document.createElement("tr");
      if (r.zone) tr.classList.add("z-" + r.zone);
      if (String(r.team_id) === teamSel.value) tr.classList.add("hl");
 
      const rankTd = cell(r.rank, "num rank");
      const zl = ZONE_LABELS[r.zone];
      if (zl) rankTd.title = zl[0];
      else if (r.note) rankTd.title = r.note;
      tr.append(rankTd);

      tr.append(rankTd);
      tr.append(logoCell(r.team, r.logo));
      tr.append(cell(r.played, "num"));
      tr.append(cell(r.win, "num"));
      tr.append(cell(r.draw, "num"));
      tr.append(cell(r.lose, "num"));
      tr.append(cell(`${r.gf}:${r.ga}`, "num"));
      tr.append(cell(r.diff > 0 ? `+${r.diff}` : r.diff, "num"));
      tr.append(cell(r.points, "num"));
      tr.append(formCell(r.form));
 
      tb.append(tr);
    }
    table.append(tb);
    wrap.append(table);
    box.append(wrap);
  }
  const present = new Set();
  for (const g of groups) {
    for (const r of g.rows) {
      if (ZONE_LABELS[r.zone]) present.add(r.zone);
    }
  }
 
  if (present.size) {
    const legend = document.createElement("p");
    legend.className = "legend";
    for (const key of Object.keys(ZONE_LABELS)) {
      if (!present.has(key)) continue;
      const [label, color] = ZONE_LABELS[key];
 
      const item = document.createElement("span");
      const swatch = document.createElement("i");
      swatch.style.background = color;
      item.append(swatch, document.createTextNode(label));
      legend.append(item);
    }
    box.append(legend);
  }
}


async function loadMatches() {
  tbody.replaceChildren();
  saveState();
  if (!teamSel.value || !seasonSel.value) return setStatus("");
 
  const want = Number(limitSel.value);
  const p = new URLSearchParams({
    team: teamSel.value,
    season: seasonSel.value,
    limit: want,
  });
  if (leagueSel.value) p.set("league", leagueSel.value);
 
  setStatus("Wczytuje mecze…");
  try {
    const rows = await api("/api/matches?" + p);
    drawRows(rows);
    refreshQuota();
 
    if (!rows.length) {
      setStatus("Brak zakonczonych meczow w tym sezonie.");
    } else if (rows.length < want) {
      setStatus(`Pokazano ${rows.length} z ${want} — wiecej meczow nie ma w tym sezonie.`);
    } else {
      setStatus("");
      loadStandings();
    }
  } catch (e) {
    setStatus(e.message, true);
  }
}
 
// ---------------- tabela ----------------
 
function cell(text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}
 
function logoCell(text, logo, cls) {
  const td = document.createElement("td");
  const span = document.createElement("span");
  span.className = "team";
  if (logo) {
    const img = document.createElement("img");
    img.src = logo; img.alt = ""; img.loading = "lazy";
    img.addEventListener("error", () => img.remove());
    span.append(img);
  }
  span.append(document.createTextNode(text));
  td.append(span);
  if (cls) td.className = cls;
  return td;
}
 
function eventIcon(ev) {
  if (ev.type === "goal") {
    if (ev.detail === "Missed Penalty") return "✗";
    return "⚽";
  }
  if (ev.type === "card") {
    if (ev.detail.startsWith("Second Yellow")) return "🟨🟥";
    if (ev.detail.startsWith("Yellow")) return "🟨";
    if (ev.detail.startsWith("Red")) return "🟥";
  }
  if (ev.type === "subst") return "🔄";
  return "•";
}
 
function eventNote(ev) {
  const parts = [];
  if (ev.detail === "Own Goal") parts.push("samobojcza");
  if (ev.detail === "Penalty") parts.push("z karnego");
  if (ev.detail === "Missed Penalty") parts.push("niewykorzystany karny");
  if (ev.assist) parts.push(`asysta: ${ev.assist}`);
  if (ev.team) parts.push(ev.team);
  return parts.length ? `(${parts.join(", ")})` : "";
}
 
function renderEvents(evs) {
  const shown = evs.filter(e => e.type === "goal" || e.type === "card");
  if (!shown.length) {
    const p = document.createElement("span");
    p.className = "muted";
    p.textContent = "Brak zdarzen dla tego meczu.";
    return p;
  }
 
  const ul = document.createElement("ul");
  ul.className = "events";
  for (const ev of shown) {
    const li = document.createElement("li");
 
    const min = document.createElement("span");
    min.className = "ev-min";
    min.textContent = ev.minute + "'";
 
    const ico = document.createElement("span");
    ico.className = "ev-ico";
    ico.textContent = eventIcon(ev);
 
    const who = document.createElement("span");
    who.textContent = ev.player;
 
    const note = document.createElement("span");
    note.className = "ev-note";
    note.textContent = eventNote(ev);
 
    li.append(min, ico, who, note);
    ul.append(li);
  }
  return ul;
}
 
async function toggleEvents(tr, fixtureId) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("details")) {
    next.remove();
    return;
  }
 
  const detail = document.createElement("tr");
  detail.className = "details";
  const td = document.createElement("td");
  td.colSpan = 7;
  td.textContent = "Wczytuje zdarzenia…";
  detail.append(td);
  tr.after(detail);
 
  try {
    const evs = await api(`/api/events?fixture=${fixtureId}`);
    td.replaceChildren(renderEvents(evs));
    refreshQuota();
  } catch (e) {
    td.textContent = e.message;
  }
}
 
function drawRows(rows) {
  tbody.replaceChildren();
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = cell("Brak meczow dla podanych kryteriow.", "muted");
    td.colSpan = 7;
    tr.append(td);
    tbody.append(tr);
    return;
  }
 
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = "match";
    tr.append(cell(r.date, "muted"));
    tr.append(logoCell(r.home, r.home_logo));
    tr.append(cell(r.score, "score"));
    tr.append(logoCell(r.away, r.away_logo));
    tr.append(logoCell(r.competition, r.competition_logo, "muted"));
    tr.append(cell(r.round, "muted"));
 
    const td = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "badge " + r.result;
    badge.textContent = r.result;
    td.append(badge);
    tr.append(td);
 
    tr.addEventListener("click", () => toggleEvents(tr, r.fixture_id));
    tbody.append(tr);
  }
}
 
// ---------------- start ----------------
 
countrySel.addEventListener("change", loadLeagues);
leagueSel.addEventListener("change", loadSeasons);
seasonSel.addEventListener("change", loadTeams);
teamSel.addEventListener("change", loadMatches);
limitSel.addEventListener("change", loadMatches);
 
(async () => {
  setStatus("Wczytuje kraje…");
  reset(leagueSel, "— rozgrywki —");
  reset(seasonSel, "— sezon —");
  reset(teamSel, "— druzyna —");
  buildShortcuts();
 
  try {
    const cs = await api("/api/countries");
    fill(countrySel, cs.map(c => ({ value: c.name, label: c.name })), "— kraj —");
    setStatus("");
    refreshQuota();
    await restoreState();
  } catch (e) { setStatus(e.message, true); }
})();
</script>
</body>
</html>
